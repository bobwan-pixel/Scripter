name: Skill3D checks

on:
  push:
    branches: [skill3d-standalone]
    paths:
      - "skill3d/**"
      - ".github/workflows/skill3d-checks.yml"
  pull_request:
    paths:
      - "skill3d/**"
      - ".github/workflows/skill3d-checks.yml"

jobs:
  python-static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Skill3D Python tools
        run: python -m compileall -q skill3d/tools skill3d/tests
      - name: Run Skill3D contract tests
        run: python -m unittest discover -s skill3d/tests -v

  blender-ffmpeg-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg
      - name: Run real Blender modeling, viseme, render, and MP4 smoke test
        run: python3 skill3d/tests/blender_smoke.py
